<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CustomForm</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    text-align: center;
}

.question {
    margin-bottom: 20px;
}

button {
    background: #4facfe;
    border: none;
    padding: 10px;
    color: white;
    width: 100%;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #00c6ff;
}
</style>
</head>

<body>

<div class="container">
    <h1 id="formTitle">My Form</h1>
    <p id="formDesc">Fill this out pls 🙏</p>

    <div id="formArea"></div>

    <button onclick="submitForm()">Submit</button>
</div>

<script>
// ==========================
// FORM CONFIG (EDIT THIS)
// ==========================
const form = {
    title: "Friend Survey",
    description: "Answer honestly 😈",
    questions: [
        {
            type: "text",
            question: "What's your name?"
        },
        {
            type: "radio",
            question: "Favorite color?",
            options: ["Red", "Blue", "Green", "Black"]
        },
        {
            type: "checkbox",
            question: "Pick games you play:",
            options: ["Minecraft", "Fortnite", "Geometry Dash", "Roblox"]
        }
    ]
};

// ==========================
// LOAD FORM
// ==========================
document.getElementById("formTitle").innerText = form.title;
document.getElementById("formDesc").innerText = form.description;

const formArea = document.getElementById("formArea");

form.questions.forEach((q, index) => {
    let div = document.createElement("div");
    div.className = "question";

    let html = `<label><b>${q.question}</b></label><br>`;

    if (q.type === "text") {
        html += `<input type="text" id="q${index}" style="width:100%">`;
    }

    if (q.type === "radio") {
        q.options.forEach(opt => {
            html += `<label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label><br>`;
        });
    }

    if (q.type === "checkbox") {
        q.options.forEach(opt => {
            html += `<label><input type="checkbox" name="q${index}" value="${opt}"> ${opt}</label><br>`;
        });
    }

    div.innerHTML = html;
    formArea.appendChild(div);
});

// ==========================
// SUBMIT FUNCTION
// ==========================
function submitForm() {
    let answers = {};

    form.questions.forEach((q, index) => {
        if (q.type === "text") {
            answers[q.question] = document.getElementById(`q${index}`).value;
        }

        if (q.type === "radio") {
            let selected = document.querySelector(`input[name="q${index}"]:checked`);
            answers[q.question] = selected ? selected.value : "None";
        }

        if (q.type === "checkbox") {
            let checked = document.querySelectorAll(`input[name="q${index}"]:checked`);
            let values = [];
            checked.forEach(c => values.push(c.value));
            answers[q.question] = values.join(", ") || "None";
        }
    });

    // DOWNLOAD FILE
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(answers, null, 2));
    let dl = document.createElement("a");
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "form_answers.json");
    dl.click();
}
</script>

</body>
</html>
